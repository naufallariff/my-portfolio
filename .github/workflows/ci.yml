name: CI — Lint, Type Check, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pengecekan tipe dipisah dan tidak bergantung pada typedRoutes
      - name: Type Check
        run: npx tsc --noEmit --project tsconfig.ci.json

      - name: Lint
        run: npm run lint

      # Build berjalan terpisah dengan pengabaian error tipe
      - name: Build
        run: npm run build
