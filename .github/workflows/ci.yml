name: CI — Lint, Type Check, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5 # ✅ Upgrade ke v5 untuk Node.js 24

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # ✅ Membersihkan next-env.d.ts dari perubahan yang tidak diinginkan
      - name: Clean next-env.d.ts
        run: |
          git checkout -- next-env.d.ts

      # ✅ Menghasilkan tipe rute yang diperlukan
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
