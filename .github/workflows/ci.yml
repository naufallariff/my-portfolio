name: CI — Lint, Type Check, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: Generate Velite types
        run: npx velite build

      - name: Type Check
        run: npx tsc --noEmit --project tsconfig.ci.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
